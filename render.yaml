services:
  - type: web
    name: junba-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: START_DATE
        sync: false
      - key: BOT_PREFIX
        sync: false
      - key: CANAL_ID_PICANHA
        sync: false
      - key: CANAL_ID_CHAT
        sync: false
